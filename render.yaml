# render.yaml — Render.com deployment config
# This file tells Render how to deploy the FastAPI backend
# ONE file deploys EVERYTHING on Render

services:
  - type: web
    name: treazy-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You set this in Render dashboard
      - key: DATABASE_URL
        value: sqlite:///./treazy.db   # SQLite on Render (persists on disk)
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
    autoDeploy: true         # Auto-redeploy on every git push
